<title>표지로 책 제목 맞히기</title>
<style>
@font-face{
  font-family:'Pretendard';
  src:url('fonts/Pretendard-Regular.woff2') format('woff2');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Pretendard';
  src:url('fonts/Pretendard-Medium.woff2') format('woff2');
  font-weight:500; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Pretendard';
  src:url('fonts/Pretendard-SemiBold.woff2') format('woff2');
  font-weight:600; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Pretendard';
  src:url('fonts/Pretendard-Bold.woff2') format('woff2');
  font-weight:700; font-style:normal; font-display:swap;
}
/* layout: centered game console — top meter strip, cover stage, two-stage action bar */
:root{
  --font:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Roboto, sans-serif;
  --bg:#EFFBF6;
  --panel:#FFFFFF;
  --ink:#10332C;
  --muted:#699489;
  --accent:#19B894;
  --accent-ink:#05231D;
  --teal:#0E9179;
  --border:#CFEEE2;
  --danger:#E0473F;
  --success:#19B894;
  --track:#DCF3EA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1915;
    --panel:#122621;
    --ink:#E3F7EF;
    --muted:#8FB5A9;
    --accent:#2FE3BC;
    --accent-ink:#06211B;
    --teal:#28C6A8;
    --border:#1F463C;
    --danger:#FF6B64;
    --success:#2FE3BC;
    --track:#17352C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1915;
  --panel:#122621;
  --ink:#E3F7EF;
  --muted:#8FB5A9;
  --accent:#2FE3BC;
  --accent-ink:#06211B;
  --teal:#28C6A8;
  --border:#1F463C;
  --danger:#FF6B64;
  --success:#2FE3BC;
  --track:#17352C;
  color-scheme: dark;
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:28px;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.wrap{
  width:100%;
  max-width:440px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
h1{
  font-family:var(--font);
  font-weight:700;
  font-size:1.7rem;
  margin:0;
  text-wrap:balance;
  letter-spacing:-0.01em;
}
.sub{
  color:var(--muted);
  font-size:0.92rem;
  line-height:1.5;
  margin:4px 0 0;
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:0 2px 14px rgba(0,0,0,0.05);
}

/* ---- start screen ---- */
.rules{
  list-style:none;
  margin:14px 0 0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.rules li{
  display:flex;
  gap:10px;
  align-items:flex-start;
  font-size:0.92rem;
  line-height:1.4;
}
.rules .dot{
  flex:none;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--accent);
  color:var(--accent-ink);
  font-family:var(--font);
  font-weight:700;
  font-size:0.78rem;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;
}

button{
  font-family:var(--font);
  border:none;
  cursor:pointer;
  font-weight:600;
  border-radius:14px;
  transition:transform .08s ease, opacity .15s ease, background .15s ease;
}
button:active{transform:scale(0.97);}
button:focus-visible{outline:3px solid var(--teal); outline-offset:2px;}
button:disabled{opacity:0.45; cursor:default;}

.btn-primary{
  background:var(--accent);
  color:var(--accent-ink);
  font-size:1.05rem;
  padding:15px 20px;
  width:100%;
}
.btn-secondary{
  background:var(--track);
  color:var(--ink);
  font-size:0.95rem;
  padding:13px 18px;
}
.btn-teal{
  background:var(--teal);
  color:var(--accent-ink);
  font-size:0.95rem;
  padding:13px 18px;
}
.btn-ghost{
  background:transparent;
  color:var(--muted);
  border:1.5px solid var(--border);
  font-size:0.9rem;
  padding:12px 16px;
}

/* ---- play screen ---- */
.meter-row{
  display:flex;
  align-items:center;
  gap:12px;
}
.meter-track{
  flex:1;
  height:10px;
  background:var(--track);
  border-radius:999px;
  overflow:hidden;
}
.meter-fill{
  height:100%;
  width:100%;
  background:var(--teal);
  border-radius:999px;
  transition:width .1s linear, background .2s ease;
}
.meter-fill.low{background:var(--danger);}
.timer-num{
  font-family:var(--font);
  font-weight:700;
  font-size:1.1rem;
  min-width:2.6ch;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.timer-num.low{color:var(--danger);}

.status-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:0.84rem;
  color:var(--muted);
  margin-top:2px;
}
.score-pips{
  display:flex;
  gap:5px;
}
.pip{
  width:11px;height:11px;
  border-radius:50%;
  background:var(--track);
  border:1.5px solid var(--border);
}
.pip.filled{
  background:var(--success);
  border-color:var(--success);
}

.stage{
  margin-top:14px;
  border-radius:16px;
  overflow:hidden;
  background:var(--track);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:260px;
}
.stage img{
  display:block;
  width:100%;
  max-height:380px;
  object-fit:contain;
}

.reveal-box{
  margin-top:14px;
  padding:14px 16px;
  border-radius:14px;
  background:var(--track);
  border:1px dashed var(--muted);
  font-family:var(--font);
  font-weight:700;
  font-size:1.15rem;
  text-align:center;
  text-wrap:balance;
}
.reveal-box.ok{ border-style:solid; border-color:var(--success); }
.reveal-box.pass{ border-style:solid; border-color:var(--muted); }
.reveal-label{
  font-family:var(--font);
  font-weight:600;
  font-size:0.74rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}

.action-row{
  margin-top:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.action-row.single{grid-template-columns:1fr;}


/* ---- end screen ---- */
.end-icon{
  width:56px;height:56px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);
  font-weight:700;
  font-size:1.5rem;
  margin-bottom:6px;
}
.end-icon.win{background:var(--success); color:var(--accent-ink);}
.end-icon.lose{background:var(--danger); color:#fff;}
h2.end-title{
  font-family:var(--font);
  font-weight:700;
  font-size:1.5rem;
  margin:0 0 6px;
}
.end-detail{
  color:var(--muted);
  font-size:0.92rem;
  line-height:1.5;
  margin:0 0 16px;
}
.answer-log{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin:0 0 18px;
}
.answer-row{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:0.86rem;
  padding:8px 10px;
  border-radius:10px;
  background:var(--track);
}
.answer-row .mark{
  flex:none;
  width:20px;height:20px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:0.72rem;
  font-weight:700;
}
.mark.ok{background:var(--success); color:var(--accent-ink);}
.mark.no{background:var(--border); color:var(--muted);}
.answer-row .title{font-weight:600; flex:1; min-width:0;}
</style>

<div class="wrap" id="app"></div>

<script>
const BOOKS = [
  {id:1,  file:'covers/1.jpg',  title:'100층짜리 집'},
  {id:2,  file:'covers/2.jpg',  title:'강아지똥'},
  {id:3,  file:'covers/3.jpg',  title:'괴물들이 사는 나라'},
  {id:4,  file:'covers/4.jpg',  title:'구름빵'},
  {id:5,  file:'covers/5.jpg',  title:'금도끼 은도끼'},
  {id:6,  file:'covers/6.jpg',  title:'누가 내 머리에 똥 쌌어?'},
  {id:7,  file:'covers/7.jpg',  title:'도깨비 감투'},
  {id:8,  file:'covers/8.jpg',  title:'돼지책'},
  {id:9,  file:'covers/9.jpg',  title:'똥떡'},
  {id:10, file:'covers/10.jpg', title:'마당을 나온 암탉'},
  {id:11, file:'covers/11.jpg', title:'무지개 물고기'},
  {id:12, file:'covers/12.jpg', title:'바리공주'},
  {id:13, file:'covers/13.jpg', title:'빨간모자'},
  {id:14, file:'covers/14.jpg', title:'아낌없이 주는 나무'},
  {id:15, file:'covers/15.jpg', title:'배고픈 애벌레'},
  {id:16, file:'covers/16.jpg', title:'책 먹는 여우'},
  {id:17, file:'covers/17.jpg', title:'콧구멍을 후비면'},
  {id:18, file:'covers/18.jpg', title:'해와 달이 된 오누이'},
  {id:19, file:'covers/19.jpg', title:'헨젤과 그레텔'},
  {id:20, file:'covers/20.jpg', title:'흥부와 놀부'},
];

const TOTAL_TIME = 25;
const NEED_CORRECT = 3;
const NUM_QUESTIONS = 5;
const PASS_LIMIT = 2;

function freshState(){
  const shuffled = [...BOOKS].sort(() => Math.random() - 0.5).slice(0, NUM_QUESTIONS);
  return {
    screen: 'start',
    order: shuffled.map(b => b.id),
    idx: 0,
    score: 0,
    passCount: 0,
    busy: false,
    feedback: null, // {title, kind: 'ok' | 'pass'}
    timeLeft: TOTAL_TIME,
    result: null,
    log: [], // {title, correct}
  };
}

let state = freshState();
let timerId = null;

function bookById(id){ return BOOKS.find(b => b.id === id); }
function currentBook(){ return bookById(state.order[state.idx]); }

function startTimer(){
  stopTimer();
  timerId = setInterval(() => {
    state.timeLeft = Math.max(0, +(state.timeLeft - 0.1).toFixed(1));
    if(state.timeLeft <= 0){
      finishGame('timeout');
      return;
    }
    renderTimerOnly();
  }, 100);
}
function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}

function startGame(){
  state = freshState();
  state.screen = 'play';
  startTimer();
  render();
}

function goHome(){
  stopTimer();
  state = freshState();
  render();
}

function answerCorrect(){
  if(state.busy) return;
  state.busy = true;
  const book = currentBook();
  state.score += 1;
  state.log.push({title: book.title, correct: true});
  state.feedback = {title: book.title, kind: 'ok'};
  render();
  setTimeout(advance, 850);
}

function answerPass(){
  if(state.busy || state.passCount >= PASS_LIMIT) return;
  state.busy = true;
  state.passCount += 1;
  const book = currentBook();
  state.log.push({title: book.title, correct: null});
  state.feedback = {title: book.title, kind: 'pass'};
  render();
  setTimeout(advance, 850);
}

function advance(){
  state.busy = false;
  state.feedback = null;
  if(state.score >= NEED_CORRECT){
    finishGame('win');
    return;
  }
  state.idx += 1;
  if(state.idx >= state.order.length){
    finishGame(state.score >= NEED_CORRECT ? 'win' : 'lose');
    return;
  }
  render();
}

function finishGame(result){
  stopTimer();
  state.result = result;
  state.screen = 'end';
  render();
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderTimerOnly(){
  const track = document.querySelector('.meter-fill');
  const num = document.querySelector('.timer-num');
  if(!track || !num) return;
  const pct = Math.max(0, (state.timeLeft / TOTAL_TIME) * 100);
  track.style.width = pct + '%';
  const low = state.timeLeft <= 5;
  track.classList.toggle('low', low);
  num.classList.toggle('low', low);
  num.textContent = state.timeLeft.toFixed(1) + 's';
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'start'){
    app.innerHTML = renderStart();
  } else if(state.screen === 'play'){
    app.innerHTML = renderPlay();
  } else {
    app.innerHTML = renderEnd();
  }
  wireEvents();
}

function renderStart(){
  return `
    <div style="text-align:center;">
      <h1>표지로 책 제목 맞히기</h1>
      <p class="sub">추억의 동화책, 얼마나 기억하고 있나요?</p>
    </div>
    <button class="btn-primary" data-action="start">시작하기</button>
  `;
}

function renderPlay(){
  const book = currentBook();
  const pct = Math.max(0, (state.timeLeft / TOTAL_TIME) * 100);
  const low = state.timeLeft <= 5;
  const pips = Array.from({length: NEED_CORRECT}, (_, i) =>
    `<span class="pip ${i < state.score ? 'filled' : ''}"></span>`
  ).join('');

  const passLeft = PASS_LIMIT - state.passCount;
  let bottom = `
    <div class="action-row">
      <button class="btn-secondary" data-action="pass" ${passLeft <= 0 || state.busy ? 'disabled' : ''}>패스</button>
      <button class="btn-teal" data-action="correct" ${state.busy ? 'disabled' : ''}>정답</button>
    </div>
  `;
  if(state.feedback){
    bottom += `
      <div class="reveal-box ${state.feedback.kind}">
        <span class="reveal-label">정답</span>
        ${esc(state.feedback.title)}
      </div>
    `;
  }

  return `
    <div>
      <div class="meter-row">
        <div class="meter-track"><div class="meter-fill ${low ? 'low' : ''}" style="width:${pct}%"></div></div>
        <div class="timer-num ${low ? 'low' : ''}">${state.timeLeft.toFixed(1)}s</div>
      </div>
      <div class="status-row">
        <span>문제 ${state.idx + 1} / ${state.order.length}</span>
        <span>패스 ${passLeft}/${PASS_LIMIT}</span>
        <span class="score-pips">${pips}</span>
      </div>
    </div>
    <div class="card">
      <div class="stage"><img src="${book.file}" alt="책 표지"></div>
      ${bottom}
    </div>
  `;
}

function renderEnd(){
  const win = state.result === 'win';
  const timeout = state.result === 'timeout';
  const icon = win ? '✓' : '✕';
  const title = win ? '성공!' : (timeout ? '시간 종료' : '아쉬워요');
  let detail;
  if(win){
    const used = (TOTAL_TIME - state.timeLeft).toFixed(1);
    detail = `${used}초 만에 ${NEED_CORRECT}개를 맞혔어요.`;
  } else if(timeout){
    detail = `25초 안에 ${NEED_CORRECT}개를 맞히지 못했어요. (${state.score}개 정답)`;
  } else {
    detail = `${NUM_QUESTIONS}문제 중 ${state.score}개 정답. ${NEED_CORRECT}개를 맞혀야 성공이에요.`;
  }

  const logRows = state.log.map(item => {
    if(item.correct === null){
      return `<div class="answer-row"><span class="mark no">–</span><span class="title">${esc(item.title)}</span><span style="color:var(--muted);font-size:0.78rem;">패스</span></div>`;
    }
    return `<div class="answer-row"><span class="mark ${item.correct ? 'ok' : 'no'}">${item.correct ? '✓' : '✕'}</span><span class="title">${esc(item.title)}</span></div>`;
  }).join('');

  return `
    <div class="card" style="text-align:center;">
      <div class="end-icon ${win ? 'win' : 'lose'}" style="margin-left:auto;margin-right:auto;">${icon}</div>
      <h2 class="end-title">${title}</h2>
      <p class="end-detail">${detail}</p>
      <div class="answer-log" style="text-align:left;">${logRows}</div>
      <div class="action-row">
        <button class="btn-ghost" data-action="home">홈으로</button>
        <button class="btn-primary" data-action="replay" style="width:auto;">다시 하기</button>
      </div>
    </div>
  `;
}

function wireEvents(){
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => {
      const action = el.getAttribute('data-action');
      if(action === 'start') startGame();
      else if(action === 'correct') answerCorrect();
      else if(action === 'pass') answerPass();
      else if(action === 'replay') startGame();
      else if(action === 'home') goHome();
    });
  });
}

function boot(saved){
  if(saved && saved.screen){
    state = saved;
    if(state.screen === 'play'){
      startTimer();
    }
  }
  render();
}

if(window.claude?.hot?.snapshot){
  window.claude.hot.snapshot(() => state);
}
if(window.claude?.hot?.ready){
  window.claude.hot.ready((data) => boot(data));
} else {
  boot(window.claude?.hot?.data);
}
</script>
